name: portfolio_tracker
description: Privacy-focused personal asset portfolio tracker.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  portfolio_core:
    path: packages/portfolio_core
  decimal: 3.2.6
  uuid: 4.6.0
  http: 1.6.0
  xml: 7.1.0
  path_provider: 2.1.6
  file_picker: 13.1.0
  shared_preferences: 2.5.6
  saf_util: 3.1.1
  saf_stream: 4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
